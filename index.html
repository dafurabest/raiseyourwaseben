<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わせべん育成ゲーム ✨ シュール＆キュート版（タブ修正）</title>
<style>
:root {
  --bg-grad: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 50%, #f3e5f5 100%);
  --card-bg: rgba(255, 255, 255, 0.88);
  --accent: #ff8a80;
  --accent-hover: #ff5252;
  --text: #37474f;
  --subtext: #78909c;
  --shadow: 0 6px 18px rgba(0,0,0,0.08);
  --radius: 18px;
  --font-main: system-ui, -apple-system, "Hiragino Sans", "Meiryo", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-main);
  background: var(--bg-grad);
  min-height: 100vh;
  color: var(--text);
  line-height: 1.6;
  padding: 20px;
  transition: background 1s ease;
}
body.twilight { --bg-grad: linear-gradient(135deg, #3a5a78 0%, #5d4e75 50%, #2d3748 100%); }

.container {
  max-width: 720px;
  margin: 0 auto;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  backdrop-filter: blur(6px);
}

header {
  text-align: center;
  padding: 24px 16px 12px;
  border-bottom: 1px solid #eee;
}
header h1 { font-size: 1.6rem; margin-bottom: 6px; }
header .subtitle { color: var(--subtext); font-size: 0.9rem; }

.tabs {
  display: flex;
  border-bottom: 2px solid #eee;
  background: #fafafa;
}
.tab-btn {
  flex: 1;
  padding: 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 1rem;
  color: var(--subtext);
  transition: 0.2s;
  text-align: center;
}
.tab-btn.active {
  color: var(--accent);
  border-bottom: 3px solid var(--accent);
  font-weight: 600;
}
.tab-btn:hover { background: #f5f5f5; }

.view {
  display: none;
  padding: 20px;
  animation: fadeIn 0.3s ease;
  min-height: 400px; /* 最低高さを確保し、画面がちらつかないように */
}
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.pigeon-stage {
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  min-height: 140px;
}
.pigeon {
  font-size: 4rem;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
  transition: transform 0.2s, filter 0.3s;
}
.pigeon.confused { animation: wobble 1.5s infinite; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25)); }
.pigeon.playing { transform: scale(1.1) rotate(-8deg); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes wobble { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.stat-card {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 10px;
  font-size: 0.85rem;
  text-align: center;
}
.stat-card .label { color: var(--subtext); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; justify-content: center; }
.stat-card .bar {
  height: 6px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin-top: 6px;
}
.stat-card .fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
.stat-card .value { font-weight: 600; margin-top: 4px; }

.actions {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 16px;
}
.btn {
  padding: 10px 16px; border: none; border-radius: 24px; background: #e3f2fd; color: #1565c0;
  font-size: 0.95rem; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;
  min-width: 80px; /* ボタンの幅を揃える */
  text-align: center;
}
.btn:hover { background: #bbdefb; transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.accent { background: var(--accent); color: white; }
.btn.accent:hover { background: var(--accent-hover); }
.btn.danger { background: #ffcdd2; color: #c62828; }

.input-group {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.input-group input {
  flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 20px; font-size: 1rem;
  transition: border 0.2s;
}
.input-group input:focus { outline: none; border-color: var(--accent); }

.dialogue-box {
  background: #fff8f0; border-left: 4px solid var(--accent); padding: 12px; border-radius: 0 12px 12px 0;
  margin-top: 10px; min-height: 40px; font-style: italic; color: #5d4037;
}
.dialogue-box.confused { color: #7b1fa2; text-shadow: 0 0 2px rgba(123,31,162,0.3); }

.word-list {
  max-height: 180px; overflow-y: auto; padding-right: 6px; margin-top: 10px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.word-tag {
  background: #e8eaf6; color: #3f51b5; padding: 4px 10px; border-radius: 14px; font-size: 0.85rem;
  display: flex; align-items: center; gap: 6px;
}
.word-tag button {
  background: transparent; border: none; color: #7986cb; cursor: pointer; font-size: 0.9rem;
}
.word-tag button:hover { color: #c62828; }

.setting-row {
  margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px;
}
.setting-row label { font-weight: 500; }
.setting-row input, .setting-row textarea {
  padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-family: monospace;
}
.setting-note { font-size: 0.8rem; color: var(--subtext); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #333; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 0.9rem;
  opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.particle {
  position: fixed; pointer-events: none; animation: drift 2s forwards;
}
@keyframes drift { to { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; } }

/* レスポンシブデザイン */
@media (max-width: 480px) {
  .container { margin: 10px; border-radius: 12px; }
  header h1 { font-size: 1.3rem; }
  .actions { flex-direction: column; }
  .btn { width: 100%; }
  .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🐦‍⬛ わせべん育成ゲーム</h1>
    <div class="subtitle">言葉を食べて育つ、不思議で少しシュールなわせべん</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="raise">🌱 育成</button>
    <button class="tab-btn" data-view="wordbook">📖 ことば帳</button>
    <button class="tab-btn" data-view="settings">⚙️ 設定</button>
  </nav>

  <main>
    <!-- 育成タブ -->
    <section id="raise-view" class="view active">
      <div class="pigeon-stage">
        <div class="pigeon" id="pigeon">🥚</div>
        <div class="dialogue-box" id="dialogue">まだ何も知らない… ことばを おしえて</div>
      </div>

      <div class="stats">
        <div class="stat-card" title="経過日数">
          <div class="label">📅 日数</div>
          <div class="bar"><div class="fill" id="day-bar"></div></div>
          <div class="value" id="day-val">0日目</div>
        </div>
        <div class="stat-card" title="覚えた言葉の数">
          <div class="label">📖 語彙量</div>
          <div class="bar"><div class="fill" id="vocab-bar"></div></div>
          <div class="value" id="vocab-val">0語</div>
        </div>
        <div class="stat-card" title="混乱度が高いと発言が抽象化">
          <div class="label">🌀 混乱度</div>
          <div class="bar"><div class="fill" id="conf-bar"></div></div>
          <div class="value" id="conf-val">おだやか</div>
        </div>
        <div class="stat-card" title="高いほどランダムイベント発生">
          <div class="label">🎲 きまぐれ</div>
          <div class="bar"><div class="fill" id="whim-bar"></div></div>
          <div class="value" id="whim-val">ふつう</div>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="word-input" placeholder="例: せかい、ゆめ、ぽてと" maxlength="12">
        <button class="btn accent" id="teach-btn">📝 おしえる</button>
      </div>

      <div class="actions">
        <button class="btn" data-action="feed">🌾 えさ</button>
        <button class="btn" data-action="sleep">💤 ねかす</button>
        <button class="btn" data-action="play">🍃 あそぶ</button>
        <button class="btn" data-action="freely_speak">💭 自由発言</button>
        <button class="btn" data-action="talk">💬 はなしかける</button>
        <button class="btn danger" id="reset-btn">🔄 リセット</button>
      </div>
    </section>

    <!-- ことば帳タブ -->
    <section id="wordbook-view" class="view">
      <h3>📚 覚えたことば</h3>
      <p style="margin-bottom: 10px; color: var(--subtext); font-size: 0.9rem;">
        これまでに「わせべん」が覚えた言葉の一覧です。
      </p>
      <div class="word-list" id="word-list">
        <span style="color:var(--subtext); font-size:0.9rem;">まだ何も覚えていません</span>
      </div>
    </section>

    <!-- 設定タブ -->
    <section id="settings-view" class="view">
      <h3>⚙️ 設定</h3>
      <div class="setting-row">
        <label for="api-key">🤖 Gemini API キー（任意）</label>
        <input type="password" id="api-key" placeholder="sk-...">
        <div class="setting-note">
          キーは端末内の localStorage にのみ保存されます。<br>
          <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studioで取得 →</a>
        </div>
      </div>
      <div class="setting-row">
        <label for="pigeon-name">🏷️ わせべんの名前</label>
        <input type="text" id="pigeon-name" placeholder="例: わせべん太郎">
      </div>
      <button class="btn" id="save-settings">💾 設定を保存</button>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== State =====
const state = {
  name: '', day: 0, vocab: 0, confusion: 0, whimsy: 0,
  words: [], history: [], apiKey: ''
};

// ===== DOM Elements =====
const $ = id => document.getElementById(id);
const pigeon = $('pigeon');
const dialogue = $('dialogue');
const toast = $('toast');

// ===== Initialization =====
function loadState() {
  const saved = localStorage.getItem('wasben_save');
  if (saved) Object.assign(state, JSON.parse(saved));
  $('pigeon-name').value = state.name;
  $('api-key').value = state.apiKey;
  updateUI();
}
function saveState() {
  state.name = $('pigeon-name').value.trim();
  state.apiKey = $('api-key').value.trim();
  localStorage.setItem('wasben_save', JSON.stringify(state));
}

// ===== UI Update =====
function updateUI() {
  $('day-val').textContent = `${state.day}日目`;
  $('day-bar').style.width = Math.min(state.day / 30 * 100, 100) + '%';

  $('vocab-val').textContent = `${state.vocab}語`;
  $('vocab-bar').style.width = Math.min(state.vocab / 20 * 100, 100) + '%';

  const confLevel = state.confusion < 30 ? 'おだやか' : state.confusion < 70 ? '少しゆらゆら' : '夢うつつ';
  $('conf-val').textContent = confLevel;
  $('conf-bar').style.width = state.confusion + '%';

  const whimLevel = state.whimsy < 30 ? 'マイペース' : state.whimsy < 70 ? 'ふつう' : 'きまぐれ';
  $('whim-val').textContent = whimLevel;
  $('whim-bar').style.width = state.whimsy + '%';

  pigeon.textContent = state.day < 2 ? '🥚' : '🐦‍⬛';
  pigeon.className = 'pigeon';
  if (state.confusion > 50) pigeon.classList.add('confused');
  if (state.whimsy > 70 && Math.random() > 0.7) pigeon.classList.add('playing');

  if (state.confusion > 50) dialogue.classList.add('confused');
  else dialogue.classList.remove('confused');

  renderWordList();
  document.body.classList.toggle('twilight', state.confusion > 60);
}

function renderWordList() {
  const container = $('word-list');
  container.innerHTML = '';
  if (state.words.length === 0) {
    container.innerHTML = '<span style="color:var(--subtext); font-size:0.9rem;">まだ何も覚えていません</span>';
    return;
  }
  state.words.forEach((w, i) => {
    const tag = document.createElement('div');
    tag.className = 'word-tag';
    tag.innerHTML = `${w} <button data-idx="${i}" title="わすれる">✕</button>`;
    container.appendChild(tag);
  });
  container.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.idx;
      state.words.splice(idx, 1);
      state.vocab = state.words.length;
      saveState(); updateUI();
      showToast('💨 ことばを風に返しました');
    };
  });
}

// ===== Helper Functions =====
function getRandomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

function generateRandomSpeech() {
    const normalSpeeches = [
        'ことばの味が、空の色みたい… 🌤️',
        '羽根の隙間から、昨日の風がこぼれた 🍃',
        'ぽかぽか。ことばが丸くなって転がっていく 🕊️',
        '夢のかけらを、そっと飲み込んだみたい ✨',
        'ふぅ。ことばは、羽根より軽いね 🌌',
        'はぁ？ なにかを思い出した気がしたけど、忘れた 🥚',
        'ことばの音が、耳の中で跳ねる 🎵',
        'ああ、また、おなかがむずむずするよ 🐛',
        'きょうのうかが、みらいのいろっぽいな 🌈',
        'ことばをたべると、ねむけがでてくる 🌙'
    ];
    const confusedSpeeches = [
        '？？？ 世界は、ことばのなみだでできている？ 🌊',
        'らせんのおくに、なぞのかたちがうごめいている… 🌀',
        'ことば？ それは、おもいでのかたち？ 🧠',
        'なにかが、なにかに、なにかに、なってる？ 🔄',
        'むらさきいろの、おと？ おと？ 🎶',
        'かぜが、はなを、きりゅうで、はなった 🌬️',
        'ことばが、ことばを、たべている 🍽️',
        'はと？ はと。はと… 🕊️',
        'むげんのかたちが、むげんにひかる 💫',
        'ああ、おもいが、はねて、ちぢんで、とんでいく 🕊️'
    ];

    if (state.confusion > 50) {
        return getRandomItem(confusedSpeeches);
    }
    return getRandomItem(normalSpeeches);
}

function triggerAutoFreeSpeech() {
    if (Math.random() * 100 < state.whimsy / 3) {
        setTimeout(() => {
            dialogue.textContent = generateRandomSpeech();
        }, 800);
    }
}

// ===== Action Handlers =====
function addWord(word) {
  word = word.trim();
  if (!word || state.words.includes(word)) return;
  state.words.push(word);
  state.vocab++;
  state.day++;
  state.confusion = Math.max(0, state.confusion + Math.floor(Math.random()*8 + 2));
  state.whimsy = Math.max(0, state.whimsy + Math.floor(Math.random()*6 - 2));

  spawnParticles(word);
  saveState(); updateUI();
  getAIResponse(`わせべんが「${word}」を覚えた。一言で感想を返して。抽象的で可愛く、30文字以内。`).then(msg => {
    dialogue.textContent = msg;
    triggerAutoFreeSpeech();
  });
}

function triggerAction(type) {
  if (type === 'feed') {
    state.day += 1; state.confusion = Math.max(0, state.confusion - 5);
    dialogue.textContent = '🌾 ことばのパンをぱくぱく。お腹がふくらむ音… ポヨポヨ';
  } else if (type === 'sleep') {
    state.day += 1; state.confusion = Math.max(0, state.confusion - 15); state.whimsy = Math.max(0, state.whimsy + 5);
    dialogue.textContent = '💤 まぶたが重くなる… 雲のベッドで夢を見る';
    pigeon.style.transform = 'rotate(90deg)';
    setTimeout(() => { pigeon.style.transform = ''; }, 1500);
  } else if (type === 'play') {
    state.day += 1; state.whimsy = Math.min(100, state.whimsy + 12);
    state.confusion = Math.min(100, state.confusion + 8);
    dialogue.textContent = '🍃 風と追いかけっこ。逆立ちして詩を詠み始めた…';
    pigeon.classList.add('playing');
    setTimeout(() => pigeon.classList.remove('playing'), 1200);
  } else if (type === 'talk') {
    getAIResponse(`わせべん（混乱度${state.confusion}、語彙${state.vocab}）への問いかけ。優しくシュールな一言を返して。30文字以内。`).then(msg => {
      dialogue.textContent = msg;
    });
    state.day += 1;
  } else if (type === 'freely_speak') {
    dialogue.textContent = generateRandomSpeech();
    state.day += 1;
    state.whimsy = Math.min(100, state.whimsy + 5);
    saveState(); updateUI();
    return;
  }
  saveState(); updateUI();
  checkWhimsyEvent();
  triggerAutoFreeSpeech();
}

function checkWhimsyEvent() {
  if (state.whimsy > 75 && Math.random() > 0.6) {
    const events = [
      '🌌 突然、空からひらがなが降ってきた',
      '🐦‍⬛ わせべんが鏡を見て「あれ？ 私、羽根だった？」と呟いた',
      '🍃 風がことばを咀嚼している音が聞こえた',
      '☁️ 雲が四角いケーキに見えた。食べたくなった'
    ];
    setTimeout(() => {
      dialogue.textContent = events[Math.floor(Math.random() * events.length)];
      showToast('✨ きまぐれイベント発生！');
    }, 800);
  }
}

// ===== AI / Fallback =====
async function getAIResponse(prompt) {
  if (state.apiKey && state.apiKey.startsWith('AIza') || state.apiKey.startsWith('sk-')) {
    try {
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + state.apiKey, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || fallbackResponse();
    } catch {
      return fallbackResponse();
    }
  }
  return fallbackResponse();
}

function fallbackResponse() {
  const pool = [
    'ことばの味が、空の色みたい… 🌤️',
    '羽根の隙間から、昨日の風がこぼれた 🍃',
    'ぽかぽか。ことばが丸くなって転がっていく 🕊️',
    '夢のかけらを、そっと飲み込んだみたい ✨',
    'ふぅ。ことばは、羽根より軽いね 🌌'
  ];
  return getRandomItem(pool);
}

// ===== Visual Effects =====
function spawnParticles(text) {
  const emojis = ['✨','🍃','🌸','🕊️','☁️','💫','🌙'];
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 200) + 'px';
    el.style.top = (window.innerHeight / 2) + 'px';
    el.style.fontSize = (1.2 + Math.random()) + 'rem';
    el.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
    el.style.setProperty('--dy', -100 - Math.random() * 150 + 'px');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

// ===== Toast Notification =====
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

// ===== Event Listeners =====
// タブ切り替え
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    // すべてのタブボタンとビューからactiveクラスを削除
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

    // 押されたボタンにactiveクラスを追加
    btn.classList.add('active');

    // 対応するビューにactiveクラスを追加
    const viewId = `${btn.dataset.view}-view`;
    $(viewId).classList.add('active');
  };
});

// その他のイベント
$('teach-btn').onclick = () => {
  const w = $('word-input').value;
  if (w) { addWord(w); $('word-input').value = ''; }
};
$('word-input').onkeydown = e => { if (e.key === 'Enter') $('teach-btn').click(); };

document.querySelectorAll('[data-action]').forEach(btn => {
  btn.onclick = () => triggerAction(btn.dataset.action);
});

$('reset-btn').onclick = () => {
  if (confirm('🐦‍⬛ データをすべて消去しますか？\n（元には戻せません）')) {
    localStorage.removeItem('wasben_save');
    location.reload();
  }
};

$('save-settings').onclick = () => {
  saveState();
  showToast('💾 設定を保存しました');
};

// ===== App Start =====
loadState();
if (state.words.length === 0 && state.day === 0) {
